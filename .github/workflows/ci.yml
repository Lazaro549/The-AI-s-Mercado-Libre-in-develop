name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  test:
    name: Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest

      - name: Compile Python modules
        run: |
          python -m compileall -q ads analyzer

      - name: Run tests
        run: |
          pytest -q

      - name: Run evaluation
        run: |
          python evaluation/run_evaluation.py

      - name: Validate evaluation report
        run: |
          test -f evaluation/reports/evaluation_report.json
          python -c "import json; json.load(open('evaluation/reports/evaluation_report.json'))"

      - name: Upload evaluation report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: evaluation-report-python-${{ matrix.python-version }}
          path: evaluation/reports/evaluation_report.json
