# AI Mercado Libre Optimizer - Configuration File

# ==========================================
# PERFORMANCE THRESHOLDS
# ==========================================

metrics:
  # Click-Through Rate thresholds (%)
  ctr:
    low: 0.02      # 2% - Threshold for low CTR problem
    good: 0.03     # 3% - Threshold for decent CTR
    excellent: 0.05  # 5% - Threshold for excellent CTR

  # Conversion Rate thresholds (%)
  conversion_rate:
    low: 0.02      # 2% - Threshold for low conversion problem
    good: 0.03     # 3% - Threshold for decent conversion
    excellent: 0.05  # 5% - Threshold for excellent conversion

  # ACOS (Advertising Cost of Sales) thresholds
  acos:
    critical: 0.40  # 40% - Critical ACOS level
    high: 0.30      # 30% - High ACOS level
    good: 0.20      # 20% - Good ACOS level

# ==========================================
# SCORING SYSTEM
# ==========================================

scoring:
  # Maximum points for each metric
  ctr_max_points: 30
  conversion_max_points: 40
  acos_max_points: 30
  
  # Classification thresholds
  scale_threshold: 70      # Score >= 70 = Scale
  optimize_threshold: 40   # 40 <= Score < 70 = Optimize
                           # Score < 40 = Pause

# ==========================================
# LOGGING
# ==========================================

logging:
  level: INFO              # DEBUG, INFO, WARNING, ERROR, CRITICAL
  format: "%(asctime)s - %(name)s - %(levelname)s - %(message)s"
  file: "logs/app.log"
  max_file_size: 10485760  # 10MB in bytes
  backup_count: 5

# ==========================================
# APPLICATION
# ==========================================

app:
  name: "AI Mercado Libre Optimizer"
  version: "1.0.0"
  debug: false
